name: Mirror to mtemizkann
on: [push, delete, workflow_dispatch]
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          git push --force --prune https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/mtemizkann/nord-site.git 'refs/remotes/origin/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
